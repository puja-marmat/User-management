# Install once:   uv run pre-commit install
# Run manually:   uv run pre-commit run --all-files
# Ruff runs from the project's locked version (uv run), so hook and CI never disagree.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: debug-statements
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        language: system
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run ruff format
        types_or: [python, pyi]

      - id: uv-lock-check
        name: uv.lock matches pyproject.toml
        language: system
        entry: uv lock --check
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      - id: alembic-check
        name: alembic single head + models vs migrations
        language: system
        entry: uv run python scripts/check_migrations.py
        pass_filenames: false
        files: ^(app/models/|alembic/)

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.31.2
    hooks:
      - id: check-github-workflows
