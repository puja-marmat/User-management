[project]
name = "prime-mdm-backend"
version = "0.1.0"
description = "Prime MDM — Backend API (SAV MDM migration from CrystalPower .NET; Phase 1 lift and shift)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aioodbc>=0.5.0",
    "alembic>=1.16.0",
    "fastapi>=0.115.0",
    "filelock>=3.16",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyjwt[crypto]>=2.9",
    "pyodbc>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "httpx>=0.27.0",
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Default `uv run pytest` = unit tests only (no database). Integration tests run only when
# asked for explicitly: `uv run pytest -m integration --no-cov` (the last -m wins), and then
# only against sav_uat (tests/integration/conftest.py).
addopts = """
  -m "not integration"
  --cov=app
  --cov-report=term-missing
  --cov-report=xml:coverage.xml
  --junitxml=pytest.xml
"""
markers = [
    "rbac: tests that verify role-based access control enforcement",
    "integration: tests that need a live SQL Server (deselect with -m 'not integration')",
    "slow: slow tests",
]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]  # SQLAlchemy async runs service code in greenlets
source = ["app"]
omit = ["*/tests/*", "*/__init__.py"]
relative_files = true

[tool.coverage.report]
# Plan DEC-29: 70% gate on auth/, services/, migration/ (enforced from M5 onward
# once those packages exist). Skeleton gate for the whole app:
fail_under = 70

# ── Ruff (plan §9, rule set as ems-mdp-backend) ──────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["alembic/versions/__init__.py"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TC", "PTH", "PERF",
    "RUF", "S", "ERA", "PIE", "RSE", "RET", "TID", "T20",
]
ignore = [
    "E501",    # ruff format controls line length
    "B008",    # FastAPI Depends() in defaults
    "TC001",   # application imports needed at runtime by FastAPI DI
    "TC002",
    "TC003",
    "SIM108",
    "RET504",
    "PERF203",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "N802", "N806"]
"scripts/**" = ["T20"]
"app/schemas/**" = ["N815"]
"alembic/versions/**" = ["S608", "ERA001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-sort-within-sections = true
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
